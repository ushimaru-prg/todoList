name: Push Code Check

on:
  push:
    branches:
      - develop

jobs:
  Push_Check:
    runs-on: ubuntu-latest
    steps:
      # node.jsの準備
      - uses: actions/checkout@v3

      - name: Use Node.js v24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      # インストール
      - run: npm ci

      # テスト、リント、フォーマットチェック
      - run: npm run lint
      - run: npm run lint-css
      - run: npm run format